indexpage:
  title: Documentazione Novus
  summary: NetApp Novus è una soluzione storage software-defined progettata per soddisfare
    le esigenze specifiche dei clienti con sistemi di calcolo exascale e fabbriche
    AI su scala gigawatt. Si basa su un'architettura NFS parallelo (pNFS) con server
    dati ONTAP. Novus è progettato principalmente per ambienti cloud e hyperscaler;
    riduce la latenza e i colli di bottiglia, mantenendo le GPU occupate, il che migliora
    drasticamente performance e scalabilità.
  keywords: novus, netapp novus, ontap data server, nfs, parallel nfs, pnfs, mds
